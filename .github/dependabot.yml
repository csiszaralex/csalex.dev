version: 2
updates:
  # pnpm projects use the npm ecosystem; Dependabot updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive as one PR a week. Each major update gets
      # its own PR, because its breaking changes need checking first.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node major in .nvmrc, not the newest Node. Raise this
      # together with .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
